version: 2
updates:
    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "04:00"
      commit-message:
          prefix: "ci"

    - package-ecosystem: "npm"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
          time: "04:00"
      open-pull-requests-limit: 10
      versioning-strategy: increase
      commit-message:
          prefix: "chore"
          include: "scope"
