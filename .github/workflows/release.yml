name: Release
on:
  push:
    tags:
      - 'v*'
      - 'config-ai-guardrails@*'
      - 'eslint-migrate@*'
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      - name: Publish @clearlint/eslint (root)
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm publish --tag lts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @clearlint/config-ai-guardrails
        if: startsWith(github.ref, 'refs/tags/config-ai-guardrails@')
        run: npm publish --access public
        working-directory: '@clearlint/config-ai-guardrails'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Publish @clearlint/eslint-migrate
        if: startsWith(github.ref, 'refs/tags/eslint-migrate@')
        run: npm publish --access public
        working-directory: '@clearlint/eslint-migrate'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
